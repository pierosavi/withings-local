[project]
name = "withings-wpp"
version = "0.4.0"
description = "Clean-room client for the Bluetooth protocol of Withings smart scales (read-only). Not affiliated with Withings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "bleak>=3.0.2",
]

[dependency-groups]
dev = ["pytest>=8"]
ha = [
    "aiousbwatcher==1.1.2",
    "bleak==3.0.2",
    "bleak-retry-connector==4.7.1",
    "bluetooth-adapters==2.4.0",
    "bluetooth-auto-recovery==1.6.4",
    "bluetooth-data-tools==1.29.24",
    "dbus-fast==5.0.22",
    "habluetooth==7.1.2",
    "pytest-homeassistant-custom-component>=0.13.372",
    "serialx==1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/withings_wpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# The library itself supports 3.13+; the dev environment follows Home Assistant's minimum.
environments = ["python_full_version >= '3.14.2'"]
