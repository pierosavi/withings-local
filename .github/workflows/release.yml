name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the integration version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version custom_components/withings_local/manifest.json)
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag doesn't match manifest version $manifest"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # Home Assistant's Python. Newer versions lack prebuilt wheels and compile from source.
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group ha --locked
      - run: uv run pytest

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No CHANGELOG.md section for $version"
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A version with letters (0.5.0b1) is a beta: HACS only offers pre-releases to users who opt in.
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME#v}" =~ [a-z] ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${prerelease[@]}"
